<style>
/* Layout: «ящик образцов» — боковая навигация по видам, сетка карточек-лотков, лист деталей поверх. */
:root {

  --shadow: 0 24px 60px -20px rgba(0, 0, 0, .7);

  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 14px;

    --bg: #eef0f4; --bg-2: #e6e9ee; --surface: #ffffff; --surface-2: #f5f6f9; --surface-3: #eceef3;
    --line: #dde1e8; --line-2: #ccd2dc; --fg: #121720; --fg-2: #4b5565; --fg-3: #7a8494;
    --accent: #b86b00; --accent-bg: #f5a93a; --accent-ink: #1c1407; --accent-soft: rgba(245, 169, 58, .16);
    --ice: #1f7fc2; --ok: #198a5a; --err: #c93a3a; --stage: #0c1016;
    --shadow: 0 24px 60px -24px rgba(20, 30, 50, .35); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0f4; --bg-2: #e6e9ee; --surface: #ffffff; --surface-2: #f5f6f9; --surface-3: #eceef3;
  --line: #dde1e8; --line-2: #ccd2dc; --fg: #121720; --fg-2: #4b5565; --fg-3: #7a8494;
  --accent: #b86b00; --accent-bg: #f5a93a; --accent-ink: #1c1407; --accent-soft: rgba(245, 169, 58, .16);
  --ice: #1f7fc2; --ok: #198a5a; --err: #c93a3a; --stage: #0c1016;
  --shadow: 0 24px 60px -24px rgba(20, 30, 50, .35); color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 var(--t-m)/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }

button, input, select, textarea { font: inherit; color: inherit; }

a { color: var(--accent); }

/* ---------- каркас ---------- */
.app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100%; }

  padding: 20px 14px 16px max(16px, env(safe-area-inset-left, 0px)); background: var(--bg-2); border-right: 1px solid var(--line); overflow-y: auto; }

[aria-pressed="true"] > .switch-mini::after { transform: translateX(12px); }

.main { min-width: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 40px 28px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; padding: 14px 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.search { position: relative; flex: 1; max-width: 520px; }

.search kbd { position: absolute; right: 10px; top: 50%; translate: 0 -50%; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line-2); font-size: 12px; color: var(--fg-3); }
.top-spacer { flex: 1; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); }
.icon-btn:hover { color: var(--fg); border-color: var(--line-2); }

/* ---------- вводный блок ---------- */
.intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 28px; align-items: end; padding: 18px 0 22px; border-bottom: 1px solid var(--line); }
.intro h1 { margin: 0; font: 800 var(--t-2xl)/1.05 var(--font-display); letter-spacing: -.035em; text-wrap: balance; max-width: 20ch; }

.intro p { margin: 10px 0 0; color: var(--fg-2); max-width: 62ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 500 12px var(--font-mono); color: var(--fg-3); }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- фильтры ---------- */
.filters { display: flex; align-items: center; gap: 8px; padding: 16px 0 14px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip-btn { flex: none; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--fg-2); font-size: 13px; white-space: nowrap; }
.chip-btn:hover { color: var(--fg); border-color: var(--line-2); }
.chip-btn[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }

.collection-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; margin-bottom: 16px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent-bg) 35%, transparent); }
.collection-bar p { margin: 0 auto 0 0; font-size: 14px; }

/* ---------- сетка карточек ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; min-width: 0; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; transition: border-color .2s, transform .2s; }
.card:hover { border-color: var(--line-2); }
.card-stage { position: relative; aspect-ratio: 16 / 10; background: var(--stage); border-bottom: 1px solid var(--line); overflow: hidden; }
.card-host { position: absolute; inset: 0; }
.card-path { position: absolute; top: 9px; left: 11px; z-index: 2; font: 500 10.5px var(--font-mono); color: rgba(233, 237, 245, .42); letter-spacing: .02em; pointer-events: none; }
.card-hint { position: absolute; left: 10px; bottom: 9px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 99px; background: rgba(12, 16, 22, .72);
  font-size: 11px; color: rgba(233, 237, 245, .75); pointer-events: none; backdrop-filter: blur(6px); transition: opacity .25s; }
.card-hint::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-bg); box-shadow: 0 0 8px var(--accent-bg); }

.tag.type { background: var(--accent-soft); color: var(--accent); }

.card-title { margin: 2px 0 0; font: 700 var(--t-l)/1.2 var(--font-display); letter-spacing: -.015em; }
.card-title button { all: unset; cursor: pointer; }
.card-title button:hover { color: var(--accent); }
.card-title button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.card-desc { margin: 0; color: var(--fg-2); font-size: 13.5px; line-height: 1.45; }
.card-tech { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.card-actions { display: flex; gap: 6px; padding: 10px 12px 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--surface-3); border-color: var(--line-2); }
.btn .i { width: 15px; height: 15px; }

.btn.fav[aria-pressed="true"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent-bg) 50%, transparent); background: var(--accent-soft); }
.btn.fav[aria-pressed="true"] .i { fill: currentColor; }

.empty { grid-column: 1 / -1; padding: 60px 20px; text-align: center; color: var(--fg-2); border: 1px dashed var(--line-2); border-radius: 18px; }
.empty b { display: block; font: 700 var(--t-l) var(--font-display); color: var(--fg); margin-bottom: 6px; }

.pv { position: absolute; inset: 0; display: grid; place-items: center; color: #e9edf5; font-family: var(--font-body); }
.pv-sound { gap: 10px; padding: 34px 18px 30px; grid-template-rows: 1fr auto; }

.pv-term { width: min(86%, 340px); border-radius: 12px; background: #0f141b; border: 1px solid #263040; overflow: hidden; font: 12px/1.6 var(--font-mono); text-align: left; }
.pv-term-head { display: flex; gap: 6px; align-items: center; padding: 7px 10px; border-bottom: 1px solid #1d2531; color: #6c7787; font-size: 11px; }
.pv-term-head i { width: 8px; height: 8px; border-radius: 50%; background: #2c3646; }
.pv-term-head i:first-child { background: #ff7a7a; } .pv-term-head i:nth-child(2) { background: #ffb547; } .pv-term-head i:nth-child(3) { background: #5ad1a0; }
.pv-term-body { padding: 9px 12px 11px; display: grid; gap: 1px; }
.pv-term-body span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv-term .k { color: #ffb547; } .pv-term .s { color: #9fd8ff; } .pv-term .c { color: #6c7787; } .pv-term .ok { color: #5ad1a0; }
.pv-term .cur::after { content: "▍"; color: #ffb547; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.pv-cover { place-items: stretch; padding: 34px 18px 36px; background: radial-gradient(120% 90% at 100% 0%, rgba(255, 181, 71, .16), transparent 55%), radial-gradient(90% 80% at 0% 100%, rgba(159, 216, 255, .12), transparent 60%), #0e131a; }
.pv-cover b { align-self: end; font: 800 clamp(18px, 1.9vw, 24px)/1.12 var(--font-display); letter-spacing: -.02em; text-wrap: balance; color: #f2f4f8; }

/* ---------- лист деталей ---------- */
.sheet { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(5, 7, 10, .62); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fade .2s ease; }
.sheet-panel { position: relative; display: flex; flex-direction: column; width: min(1240px, 100%); height: min(860px, 100%); border-radius: 22px; background: var(--bg-2); border: 1px solid var(--line-2); box-shadow: var(--shadow); overflow: hidden; animation: rise .32s cubic-bezier(.2,.8,.2,1); }
@keyframes fade { from { opacity: 0; } }

.sheet-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 20px; border-bottom: 1px solid var(--line); }
.sheet-title { min-width: 0; flex: 1; }
.sheet-title small { display: block; font: 500 11px var(--font-mono); color: var(--fg-3); letter-spacing: .02em; }
.sheet-title h2 { margin: 1px 0 0; font: 800 22px/1.15 var(--font-display); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-tools { display: flex; gap: 6px; }
.sheet-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.sheet-left { min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); overflow-y: auto; }
.sheet-right { min-width: 0; display: flex; flex-direction: column; min-height: 0; }

.stage-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--fg-2); font-size: 12px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--fg); }
.stage { position: relative; flex: none; height: clamp(260px, 44vh, 400px); display: grid; place-items: center; padding: 14px; background: var(--surface); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 16px 16px; }
.stage-frame { position: relative; width: 100%; height: 100%; border-radius: 14px; overflow: hidden; background: var(--stage); box-shadow: 0 0 0 1px var(--line-2); transition: width .35s cubic-bezier(.2,.8,.2,1); }
.stage-frame[data-w="mobile"] { width: min(375px, 100%); }
.stage-host { position: absolute; inset: 0; }
.stage-frame:fullscreen { border-radius: 0; }

.params { padding: 16px 18px 22px; display: grid; gap: 14px; }
.params-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.params-head h3 { margin: 0; font: 700 14px var(--font-display); letter-spacing: .01em; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--fg-2); }
.field output { font: 500 12px var(--font-mono); color: var(--fg); font-variant-numeric: tabular-nums; }
.field input[type="range"] { width: 100%; accent-color: var(--accent-bg); }
.field input[type="text"], .field textarea, .field select { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); outline: none; }
.field textarea { min-height: 84px; resize: vertical; line-height: 1.45; font-size: 13px; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
.color-row { display: flex; gap: 8px; align-items: center; }
.color-row input[type="color"] { width: 40px; height: 34px; padding: 2px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
.color-row input[type="text"] { font-family: var(--font-mono); font-size: 13px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--fg-2); text-align: left; }
.toggle-row .switch-mini { margin-left: 0; }
.warn { margin: 0; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--accent-bg) 14%, transparent); color: var(--fg); font-size: 12.5px; }

.tabs { display: flex; gap: 2px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); }
.tab { position: relative; padding: 9px 14px 11px; border: 0; background: none; color: var(--fg-2); font-weight: 500; font-size: 14px; }
.tab[aria-selected="true"] { color: var(--fg); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent-bg); }
.tab-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 24px; }

.about h3 { margin: 18px 0 6px; font: 700 13px var(--font-display); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); }
.about h3:first-child { margin-top: 0; }
.about p { margin: 0; color: var(--fg); line-height: 1.6; max-width: 65ch; }
.about ul, .about ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; color: var(--fg); }
.about .lead { color: var(--fg-2); font-size: 15px; }
.related { display: grid; gap: 6px; }
.related button { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-size: 14px; }
.related button:hover { border-color: var(--line-2); }
.related small { color: var(--fg-3); font-size: 12px; }

.code-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.code-bar .seg { max-width: 100%; overflow-x: auto; }
.code-bar .actions { margin-left: auto; display: flex; gap: 6px; }

      };
      const leave = () => { hover = false; };
      root.addEventListener('pointermove', move);
      root.addEventListener('pointerleave', leave);
      const loop = (now) => {
        if (!hover) {
          const t = (now - t0) / 1000;
          trx = reduced ? 0 : Math.sin(t * 0.9) * p.max * 0.35;
          try_ = reduced ? 0 : Math.cos(t * 0.7) * p.max * 0.5;
          gx = 50 + try_ * 2; gy = 30 - trx * 2;

        card.style.setProperty('--gx', gx + '%'); card.style.setProperty('--gy', gy + '%');

    run: (root, p) => {
      const els = [...root.querySelectorAll('.cu-num')];
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const parse = (s) => {
        const m = String(s).match(/-?\d[\d\s ]*(?:[.,]\d+)?/);
        if (!m) return null;
        const raw = m[0], sep = raw.includes(',') ? ',' : '.';
        const dec = (raw.split(/[.,]/)[1] || '').length;
        return { pre: s.slice(0, m.index), post: s.slice(m.index + raw.length), value: parseFloat(raw.replace(/[\s ]/g, '').replace(',', '.')), dec, sep };
      };
      let raf = 0;

        cancelAnimationFrame(raf);
        const items = els.map((el) => ({ el, d: parse(el.dataset.value) }));
        const t0 = performance.now();
        const fmt = (d, v) => {
          let s = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: d.dec, maximumFractionDigits: d.dec }).format(v);
          if (d.sep === '.') s = s.replace(',', '.');
          return d.pre + s + d.post;
        };
        const step = (now) => {
          const k = reduced ? 1 : Math.min(1, (now - t0) / p.duration);
          const e = k === 1 ? 1 : 1 - Math.pow(2, -10 * k);
          items.forEach(({ el, d }) => { el.textContent = d ? fmt(d, d.value * e) : el.dataset.value; });
          if (k < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
      };
      const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { play(); io.disconnect(); } }, { threshold: 0.4 });
      io.observe(root);
      root.addEventListener('click', play);
      return () => { cancelAnimationFrame(raf); io.disconnect(); root.removeEventListener('click', play); };
    },
  });

    css: () => `
      .cf-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    run: (root, p) => {

      let w = 0, h = 0, raf = 0, parts = [];

      const set = (to) => {

<p>Код каждого компонента Glint берётся из того же исходника, который рисует превью. То, что вы видите в карточке, и есть то, что скачаете. Ниже — как выбрать формат и встроить его без сюрпризов.</p>
<h2>Выберите формат</h2>
<p><b>Один файл</b> — готовая HTML-страница со стилями и скриптом. Откройте её в браузере, и всё работает. Подходит, чтобы показать заказчику или быстро проверить идею.</p>

<h2>Настройте до экспорта</h2>

<h2>Как браузер рисует кадр</h2>
<p>Изменение стиля проходит до трёх этапов: <b>layout</b> (пересчёт геометрии), <b>paint</b> (перерисовка пикселей) и <b>composite</b> (склейка слоёв на видеокарте). Чем раньше этап, тем дороже. Если менять width, top или margin, браузер каждый кадр заново считает раскладку, причём часто не только у элемента, но и у соседей.</p>
<h2>Безопасные свойства</h2>
<p><b>transform</b> и <b>opacity</b> обрабатываются на этапе композиции и почти ничего не стоят. Вместо left используйте translate, вместо width — scale, вместо visibility с задержкой — opacity. Свойства filter и clip-path дороже, но на небольших элементах тоже держат 60 fps. Обводка-комета и переключатель темы в каталоге построены именно на них.</p>
<h2>will-change — это не волшебная таблетка</h2>
<p>will-change: transform заранее выносит элемент на отдельный слой. Это помогает, если анимация вот-вот начнётся. Но каждый слой занимает видеопамять, и сотня таких элементов на странице замедлит её, а не ускорит. Ставьте will-change точечно и снимайте после анимации.</p>
<h2>JavaScript и requestAnimationFrame</h2>
<p>Если анимацией управляет скрипт, используйте requestAnimationFrame, а не setInterval: он синхронизирован с обновлением экрана и сам засыпает в фоновой вкладке. Не читайте размеры (getBoundingClientRect, offsetWidth) в том же кадре, где их меняете, иначе получите принудительную перерисовку раскладки. Сначала прочитайте всё, потом запишите.</p>

<p>Озвучивайте события, у которых есть последствия: отправка, оплата, ошибка, входящее сообщение. Наведение курсора и прокрутку не озвучивайте: такие события происходят десятки раз в минуту.</p>

<h2>3. Смысл в высоте тона</h2>
<p>Восходящие интервалы читаются как «да» и «готово», нисходящие — как «нет» и «отмена». Поэтому <a data-open="success">успех</a> — это мажорное арпеджио вверх, а <a data-open="error">ошибка</a> — пара нот вниз. Включение и выключение одного тумблера звучат одинаково по тембру, но на разной высоте.</p>

<h2>Matcher</h2>

      <article class="card" data-id="${item.id}" data-type="${item.type}">
        <div class="card-stage">
          <div class="card-host"></div>
          ${isArticle ? '' : `<span class="card-path">glint/${item.type}/${item.id}</span>`}
          ${item.hint ? `<span class="card-hint">${esc(item.hint)}</span>` : ''}
        </div>
        <div class="card-body">
          <div class="card-meta"><span class="tag type">${esc(item.builder ? 'Конструктор' : T.one)}</span><span class="tag">${esc(item.group)}</span>${item.event && !item.builder ? `<span class="tag mono">${esc(item.event)}</span>` : ''}</div>
          <h3 class="card-title"><button type="button" data-act="about">${esc(item.title)}</button></h3>
          <p class="card-desc">${esc(item.desc)}</p>
          ${item.tech.length ? `<div class="card-tech">${item.tech.map((t) => `<span class="tag mono">${esc(t)}</span>`).join('')}</div>` : ''}
        </div>
        <div class="card-actions">
          ${isArticle
            ? `<button class="btn grow" type="button" data-act="read">${I('book')}Читать · ${readMinutes(item.body)} мин</button>`
            : `<button class="btn grow" type="button" data-act="about">${I('info')}Подробнее</button><button class="btn grow" type="button" data-act="code">${I('code')}Код</button><button class="btn grow" type="button" data-act="prompt">${I('prompt')}Промпт</button>`}
          <button class="btn fav" type="button" data-act="fav" aria-pressed="${S.fav.has(item.id)}" aria-label="В избранное">${I('star')}</button>
        </div>
      </article>`);
    cards.set(item.id, card);
    io.observe(card);
    return card;
  };
  const frag = document.createDocumentFragment();
  G.items.forEach((it) => frag.appendChild(makeCard(it)));
  grid.appendChild(frag);
  const emptyEl = h('<div class="empty" hidden></div>');
  grid.appendChild(emptyEl);

  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.closest('.card').dataset.id, item = G.byId[id];
    const act = btn.dataset.act;
    if (act === 'fav') return toggleFav(id);
    if (item.type === 'article' || act === 'read') return openReader(item);
    openSheet(item, act === 'about' ? 'about' : act);
  });

  const toggleFav = (id) => {
    const on = !S.fav.has(id);
    on ? S.fav.add(id) : S.fav.delete(id);
    G.store.set('fav', [...S.fav]);
    cards.get(id).querySelector('[data-act="fav"]').setAttribute('aria-pressed', on);
    $('#fav-count').textContent = S.fav.size;
    if (sheet.item && sheet.item.id === id) sheetFavBtn().setAttribute('aria-pressed', on);
    toast(on ? 'Добавлено в избранное' : 'Убрано из избранного');
    uiPlay('pop', on ? 1.1 : 0.8);
    if (S.view === 'fav') applyFilters();
  };

  /* ---------- фильтрация и поиск ---------- */
  const list = () => {
    const words = S.q.toLowerCase().split(/\s+/).filter(Boolean);
    return G.items.filter((it) => {
      if (S.view === 'fav' ? !S.fav.has(it.id) : S.view !== 'all' && it.type !== S.view) return false;
      if (S.group && it.group !== S.group) return false;
      if (!words.length) return true;
      const hay = [it.title, it.desc, it.group, G.types[it.type].label, G.types[it.type].one, it.event || '', ...it.tech, it.id].join(' ').toLowerCase();
      return words.every((w) => hay.includes(w));
    });
  };

  const renderFilters = () => {
    const pool = G.items.filter((it) => (S.view === 'fav' ? S.fav.has(it.id) : S.view === 'all' || it.type === S.view));
    const groups = [...new Set(pool.map((i) => i.group))];
    if (S.group && !groups.includes(S.group)) S.group = null;
    filters.innerHTML = groups.length > 1
      ? `<button class="chip-btn" type="button" data-group="" aria-pressed="${!S.group}">Все темы</button>` +
        groups.map((g) => `<button class="chip-btn" type="button" data-group="${esc(g)}" aria-pressed="${S.group === g}">${esc(g)}</button>`).join('') +
        '<span class="result-note" id="note"></span>'
      : '<span class="result-note" id="note"></span>';
  };
  filters.addEventListener('click', (e) => {
    const b = e.target.closest('[data-group]');
    if (!b) return;
    S.group = b.dataset.group || null;
    filters.querySelectorAll('[data-group]').forEach((x) => x.setAttribute('aria-pressed', (x.dataset.group || null) === S.group));
    applyFilters();
  });

  const renderCollection = () => {
    if (S.view !== 'fav' || !S.fav.size) { collection.innerHTML = ''; return; }
    collection.innerHTML = `<div class="collection-bar"><p><b>${plural(S.fav.size, ['элемент', 'элемента', 'элементов'])}</b> в вашем паке. Скачайте всё одним архивом с вашими настройками.</p>
      <button class="btn primary" type="button" id="pack-dl" ${G.canSave() ? '' : 'disabled'}>${I('pack')}Скачать пак .zip</button>
      <button class="btn" type="button" id="pack-clear">${I('trash')}Очистить</button></div>`;
  };
  collection.addEventListener('click', (e) => {
    if (e.target.closest('#pack-dl')) downloadPack();
    if (e.target.closest('#pack-clear')) {
      const b = e.target.closest('#pack-clear');
      if (b.dataset.confirm) {
        S.fav.clear(); G.store.set('fav', []);
        cards.forEach((c) => c.querySelector('[data-act="fav"]').setAttribute('aria-pressed', 'false'));
        $('#fav-count').textContent = 0; applyFilters(); toast('Избранное очищено');
      } else { b.dataset.confirm = '1'; b.innerHTML = I('trash') + 'Точно очистить?'; setTimeout(() => { if (b.isConnected) { delete b.dataset.confirm; b.innerHTML = I('trash') + 'Очистить'; } }, 3000); }
    }
  });

  let currentList = [];
  const applyFilters = () => {
    renderCollection();
    currentList = list();
    const ids = new Set(currentList.map((i) => i.id));
    cards.forEach((card, id) => { card.hidden = !ids.has(id); });
    const note = $('#note');
    if (note) note.textContent = S.q || S.group ? `Найдено: ${currentList.length}` : plural(currentList.length, ['элемент', 'элемента', 'элементов']);
    emptyEl.hidden = currentList.length > 0;
    if (!currentList.length) {
      emptyEl.innerHTML = S.view === 'fav' && !S.q
        ? '<b>Избранное пока пустое</b>Нажмите звёздочку на карточке, чтобы собрать свой пак и скачать его одним архивом.'
        : `<b>Ничего не нашлось</b>Попробуйте другое слово или <button class="btn" type="button" id="reset-q" style="display:inline-flex;margin-left:6px">сбросьте фильтры</button>`;
    }
  };
  emptyEl.addEventListener('click', (e) => {
    if (e.target.closest('#reset-q')) { S.q = ''; qInput.value = ''; S.group = null; setView('all'); }
  });

  const setView = (v) => {
    S.view = v; S.group = null;
    document.querySelectorAll('.nav-btn[data-view]').forEach((b) => b.setAttribute('aria-current', b.dataset.view === v));
    renderFilters(); applyFilters();
  };
  document.querySelector('.nav').addEventListener('click', (e) => {
    const b = e.target.closest('[data-view]');
    if (b) { setView(b.dataset.view); $('#main').scrollIntoView({ block: 'start' }); window.scrollTo({ top: 0 }); }
  });
  let qTimer = 0;
  qInput.addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = qInput.value.trim(); applyFilters(); }, 90); });
  G.onSaverChange(() => renderCollection());

  /* ---------- экспорт ---------- */
  const fileLang = (path) => (/\.json$/.test(path) ? 'json' : /\.sh$/.test(path) ? 'sh' : /\.md$/.test(path) ? 'md' : /\.css$/.test(path) ? 'css' : /\.html$/.test(path) ? 'html' : 'js');
  const zipPath = (p) => p.replace(/^~\//, 'home/');

  const filesFor = (item, p, prefix = '') => {
    const out = {};
    if (item.type === 'component') {
      const x = G.exportComponent(item, p);
      out[prefix + 'index.html'] = x.single;
      out[prefix + 'snippet/markup.html'] = x.html + '\n';
      out[prefix + 'snippet/style.css'] = x.css + '\n';
      if (x.js) out[prefix + 'snippet/script.js'] = x.js + '\n';
      out[prefix + `react/${x.reactName}.jsx`] = x.react;
    } else if (item.type === 'hook' || item.type === 'skill') {
      for (const [k, v] of Object.entries(item.files(p))) out[prefix + zipPath(k)] = v;
    } else if (item.type === 'article') {
      out[prefix + item.id + '.md'] = '# ' + item.title + '\n\n' + item.body.replace(/<h2>(.*?)<\/h2>/g, '\n## $1\n').replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g, '\n```\n$1\n```\n').replace(/<code>(.*?)<\/code>/g, '`$1`').replace(/<b>(.*?)<\/b>/g, '**$1**').replace(/<p>/g, '\n').replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/\n{3,}/g, '\n\n').trim() + '\n';
    }
    return out;
  };

  const readme = (items) => `# Glint pack\n\nСобрано ${new Date().toLocaleDateString('ru-RU')}.\n\n${items.map((it) => `- **${it.title}** (${G.types[it.type].one.toLowerCase()}): ${it.desc}`).join('\n')}\n\n## Как использовать\n- Компоненты: откройте index.html, чтобы посмотреть; snippet/ — для вставки в сайт; react/ — компонент для React.\n- Звуки: sounds/sounds.js содержит функции play*(); WAV-файлы лежат рядом.\n- Хуки и скиллы: структура папок повторяет проект. Пути home/ соответствуют вашей домашней папке (~). Если settings.json уже есть, объедините ключ "hooks", а не заменяйте файл.\n`;

  const downloadItem = async (item) => {
    const p = params(item);
    try {
      let files;
      if (item.type === 'sound') {
        const buf = await G.renderSound(item, p);
        files = { [`${item.id}.js`]: G.soundCode(item, p), [`${item.id}.wav`]: G.encodeWav(buf) };
      } else files = filesFor(item, p);
      files['README.md'] = readme([item]);
      await saveFile(`glint-${item.id}.zip`, await G.zip(files));
    } catch (e) { console.error(e); toast('Не удалось собрать архив: ' + e.message, true); }
  };

  const downloadPack = async () => {
    const items = G.items.filter((i) => S.fav.has(i.id));
    try {
      const files = { 'README.md': readme(items) };
      const sounds = items.filter((i) => i.type === 'sound');
      if (sounds.length) {
        files['sounds/sounds.js'] = '// Glint · звуки интерфейса — синтез через Web Audio.\nconst glintAudio = new (window.AudioContext || window.webkitAudioContext)();\n\n' + sounds.map((s) => G.soundCode(s, params(s), { standalone: false })).join('\n');
        for (const s of sounds) files[`sounds/${s.id}.wav`] = G.encodeWav(await G.renderSound(s, params(s)));
      }
      for (const it of items) {
        if (it.type === 'component') Object.assign(files, filesFor(it, params(it), `components/${it.id}/`));
        if (it.type === 'hook') Object.assign(files, filesFor(it, params(it), `hooks/${it.id}/`));
        if (it.type === 'skill') Object.assign(files, filesFor(it, params(it), 'skills/'));
        if (it.type === 'article') Object.assign(files, filesFor(it, params(it), 'articles/'));
      }
      await saveFile('glint-pack.zip', await G.zip(files));
    } catch (e) { console.error(e); toast('Не удалось собрать пак: ' + e.message, true); }
  };

  /* ---------- промпты ---------- */
  const fmtVal = (prm, v) => {
    if (prm.type === 'toggle') return v ? 'да' : 'нет';
    if (prm.type === 'select') return (prm.options.find((o) => o[0] === v) || [v, v])[1];
    if (prm.type === 'textarea') return '\n    ' + String(v).split('\n').join('\n    ');
    return v + (prm.unit ? ' ' + prm.unit : '');
  };
  const promptFor = (item, p, opt) => {
    const paramLines = item.params.filter((x) => x.id !== 'scope').map((x) => `- ${x.label}: ${fmtVal(x, p[x.id])}`).join('\n');
    if (item.type === 'component') {
      const stack = { vanilla: 'чистые HTML, CSS и JavaScript', react: 'React (функциональный компонент, хуки)', vue: 'Vue 3 (Composition API, <script setup>)', svelte: 'Svelte' }[opt.stack];
      const x = G.exportComponent(item, p);
      return `Добавь в проект компонент «${item.title}». ${item.desc}

Как он работает:
${item.about.how}

Параметры (уже подобраны):
${paramLines}

Требования:
- Стек: ${stack}. Без сторонних библиотек.
- Стили изолированы: у всех классов единый префикс, никаких глобальных правил для тегов.
- Учитывай prefers-reduced-motion.
- При удалении компонента сними все слушатели, останови requestAnimationFrame и таймеры${opt.stack === 'react' ? ' (cleanup в useEffect, компонент должен переживать StrictMode)' : ''}.
${item.about.notes.map((n) => '- ' + n).join('\n')}
- Проверь на ширине 375 и 1440 px, пройди все состояния и убедись, что в консоли нет ошибок.
${opt.code ? `\nЭталонная реализация (адаптируй под проект, а не вставляй вслепую):\n\n\`\`\`${opt.stack === 'react' ? 'jsx' : 'html'}\n${opt.stack === 'react' ? x.react : x.single}\`\`\`\n` : ''}`;
    }
    if (item.type === 'sound') {
      return `Добавь в интерфейс звук «${item.title}». ${item.desc}
Где использовать: ${item.about.use.join('; ')}.

Как он устроен:
${item.about.how}

Требования:
- Синтез через Web Audio API, без аудиофайлов.
- Один общий AudioContext на приложение, создавать или возобновлять его по первому действию пользователя.
- Общий переключатель «Звуки интерфейса» в настройках, состояние сохраняется в localStorage, по умолчанию звук ${opt.on ? 'включён' : 'выключен'}.
- Громкость ${p.volume}, высота тона ${p.pitch}×.
- Важная информация дублируется на экране, а не передаётся только звуком.
${opt.code ? `\nЭталон:\n\n\`\`\`js\n${G.soundCode(item, p)}\`\`\`\n` : ''}`;
    }
    const files = item.files(p);
    const kind = item.type === 'hook' ? 'хук' : 'скилл';
    return `Установи в проект ${kind} «${item.title}». ${item.desc}

Создай файлы:
${Object.keys(files).map((f) => '- ' + f).join('\n')}

Правила:
- Сначала проверь, есть ли эти файлы. Если settings.json уже существует, объедини ключ "hooks" с текущим содержимым и ничего не удаляй.
${Object.keys(files).some((f) => f.endsWith('.sh')) ? '- Сделай скрипты исполняемыми (chmod +x) и проверь, что установлен jq.\n' : ''}- После установки ${item.type === 'hook' ? 'покажи вывод /hooks и проверь срабатывание на безопасном примере' : 'проверь, что скилл виден в списке доступных'}.

${Object.entries(files).map(([f, c]) => `Файл ${f}:\n\`\`\`${fileLang(f)}\n${c.trimEnd()}\n\`\`\``).join('\n\n')}
`;
  };

  /* ---------- лист деталей ---------- */
  const sheetEl = h(`
    <div class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-h">
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet-panel">
        <header class="sheet-head">
          <div class="sheet-title"><small id="sheet-crumb"></small><h2 id="sheet-h"></h2></div>
          <div class="sheet-tools">
            <button class="icon-btn hide-sm" type="button" data-nav="-1" aria-label="Предыдущий">${I('left')}</button>
            <button class="icon-btn hide-sm" type="button" data-nav="1" aria-label="Следующий">${I('right')}</button>
            <button class="icon-btn btn fav" type="button" id="sheet-fav" aria-label="В избранное" style="width:40px;height:40px;padding:0">${I('star')}</button>
            <button class="icon-btn" type="button" data-close aria-label="Закрыть">${I('close')}</button>
          </div>
        </header>
        <div class="sheet-grid">
          <section class="sheet-left">
            <div class="stage-bar">
              <button class="btn" type="button" id="st-replay">${I('replay')}Перезапуск</button>
              <div class="seg" id="st-bg" role="group" aria-label="Фон сцены"><button type="button" data-bg="" aria-pressed="true">Графит</button><button type="button" data-bg="#000" aria-pressed="false">Чёрный</button><button type="button" data-bg="grid" aria-pressed="false">Сетка</button></div>
              <div class="seg" id="st-w" role="group" aria-label="Ширина"><button type="button" data-w="" aria-pressed="true">Широко</button><button type="button" data-w="mobile" aria-pressed="false">375 px</button></div>
              <button class="icon-btn" type="button" id="st-full" aria-label="На весь экран" style="width:34px;height:34px;margin-left:auto">${I('full')}</button>
            </div>
            <div class="stage"><div class="stage-frame"><div class="stage-host"></div></div></div>
            <div class="params" id="params"></div>
          </section>
          <section class="sheet-right">
            <div class="tabs" role="tablist">
              <button class="tab" role="tab" type="button" data-tab="about">Обзор</button>
              <button class="tab" role="tab" type="button" data-tab="code">Код</button>
              <button class="tab" role="tab" type="button" data-tab="prompt">Промпт</button>
            </div>
            <div class="tab-body" id="tab-body" role="tabpanel"></div>
          </section>
        </div>
      </div>
    </div>`);
  document.body.appendChild(sheetEl);
  const sheet = { item: null, p: null, tab: 'about', preview: null, codeTab: null, promptOpt: { stack: 'vanilla', code: true, on: true }, lastFocus: null };
  const sheetFavBtn = () => $('#sheet-fav', sheetEl);
  const stageFrame = $('.stage-frame', sheetEl);
  let stageHost = $('.stage-host', sheetEl);

  // Хост пересоздаётся при каждом монтировании: прикреплённый Shadow DOM
  // от компонента иначе скрыл бы обычные превью звуков, хуков и скиллов.
  const mountStage = () => {
    if (sheet.preview) sheet.preview.destroy();
    const fresh = document.createElement('div');
    fresh.className = 'stage-host';
    const stageVar = stageHost.style.getPropertyValue('--glint-stage');
    if (stageVar) fresh.style.setProperty('--glint-stage', stageVar);
    stageHost.replaceWith(fresh); stageHost = fresh;
    sheet.preview = renderPreview(stageHost, sheet.item, sheet.p, true);
  };

  const renderParams = () => {
    const item = sheet.item, p = sheet.p, box = $('#params', sheetEl);
    if (!item.params.length) { box.innerHTML = ''; return; }
    const ctl = (x) => {
      const id = 'p-' + x.id, v = p[x.id];
      if (x.type === 'range') return `<div class="field"><label for="${id}">${esc(x.label)}<output id="${id}-o">${v}${x.unit ? ' ' + esc(x.unit) : ''}</output></label><input id="${id}" data-p="${x.id}" type="range" min="${x.min}" max="${x.max}" step="${x.step}" value="${v}"></div>`;
      if (x.type === 'color') return `<div class="field"><label for="${id}">${esc(x.label)}</label><div class="color-row"><input id="${id}" data-p="${x.id}" type="color" value="${v}"><input id="${id}-hex" data-hex="${x.id}" type="text" value="${v}" maxlength="7" spellcheck="false" aria-label="${esc(x.label)}, HEX"></div></div>`;
      if (x.type === 'toggle') return `<div class="field"><button class="toggle-row" id="${id}" data-p="${x.id}" type="button" aria-pressed="${v}">${esc(x.label)}<span class="switch-mini"></span></button></div>`;
      if (x.type === 'select') {
        if (x.options.length <= 3 && x.options.every((o) => o[1].length < 16)) return `<div class="field"><span class="lbl">${esc(x.label)}</span><div class="seg" role="group" aria-label="${esc(x.label)}">${x.options.map((o) => `<button type="button" data-p="${x.id}" data-v="${esc(o[0])}" aria-pressed="${o[0] === v}">${esc(o[1])}</button>`).join('')}</div></div>`;
        return `<div class="field"><label for="${id}">${esc(x.label)}</label><select id="${id}" data-p="${x.id}">${x.options.map((o) => `<option value="${esc(o[0])}"${o[0] === v ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select></div>`;
      }
      if (x.type === 'textarea') return `<div class="field"><label for="${id}">${esc(x.label)}</label><textarea id="${id}" data-p="${x.id}" spellcheck="false">${esc(v)}</textarea></div>`;
      return `<div class="field"><label for="${id}">${esc(x.label)}</label><input id="${id}" data-p="${x.id}" type="text" value="${esc(v)}" spellcheck="false"></div>`;
    };
    const warns = item.validate ? item.validate(p) : [];
    box.innerHTML = `<div class="params-head"><h3>Настройки</h3><button class="btn ghost" type="button" id="p-reset" ${isCustom(item) ? '' : 'disabled'}>${I('reset')}Сбросить</button></div>
      ${item.params.map(ctl).join('')}<div id="p-warn">${warns.map((w) => `<p class="warn">${esc(w)}</p>`).join('')}</div>`;
  };

  let pTimer = 0;
  const onParamsChanged = (instant) => {
    saveParams(sheet.item, sheet.p);
    $('#p-reset', sheetEl).disabled = !isCustom(sheet.item);
    const warnBox = $('#p-warn', sheetEl);
    if (warnBox && sheet.item.validate) warnBox.innerHTML = sheet.item.validate(sheet.p).map((w) => `<p class="warn">${esc(w)}</p>`).join('');
    clearTimeout(pTimer);
    pTimer = setTimeout(() => {
      mountStage();
      if (sheet.tab !== 'about') renderTab();
      remountCard(sheet.item);
      if (sheet.item.type === 'sound' && sheet.preview.play) setTimeout(() => sheet.preview.play(), 60);
    }, instant ? 0 : 160);
  };
  const paramsBox = $('#params', sheetEl);
  paramsBox.addEventListener('input', (e) => {
    const t = e.target, k = t.dataset.p || t.dataset.hex;
    if (!k) return;
    const def = sheet.item.params.find((x) => x.id === k);
    if (t.dataset.hex) {
      if (!/^#[0-9a-f]{6}$/i.test(t.value)) return;
      sheet.p[k] = t.value.toLowerCase(); $('#p-' + k, sheetEl).value = sheet.p[k];
    } else if (def.type === 'range') {
      sheet.p[k] = parseFloat(t.value);
      $('#p-' + k + '-o', sheetEl).textContent = t.value + (def.unit ? ' ' + def.unit : '');
    } else if (def.type === 'color') {
      sheet.p[k] = t.value; $('#p-' + k + '-hex', sheetEl).value = t.value;
    } else sheet.p[k] = t.value;
    onParamsChanged(def.type === 'select');
  });
  paramsBox.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.id === 'p-reset') {
      delete S.custom[sheet.item.id]; G.store.set('params', S.custom);
      sheet.p = params(sheet.item); renderParams(); onParamsChanged(true); toast('Настройки сброшены');
      return;
    }
    const k = t.dataset.p;
    if (!k) return;
    const def = sheet.item.params.find((x) => x.id === k);
    if (def.type === 'toggle') { sheet.p[k] = !sheet.p[k]; t.setAttribute('aria-pressed', sheet.p[k]); }
    else if (def.type === 'select') { sheet.p[k] = t.dataset.v; t.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === t)); }
    onParamsChanged(true);
  });

  const codeViews = (item, p) => {
    if (item.type === 'component') {
      const x = G.exportComponent(item, p);
      const v = [['single', 'Один файл', x.single, 'html'], ['html', 'HTML', x.html, 'html'], ['css', 'CSS', x.css, 'css']];
      if (x.js) v.push(['js', 'JS', x.js, 'js']);
      v.push(['react', 'React', x.react, 'jsx']);
      return v;
    }
    if (item.type === 'sound') {
      const all = '// Glint · все звуки — синтез через Web Audio.\nconst glintAudio = new (window.AudioContext || window.webkitAudioContext)();\n\n' + G.items.filter((i) => i.type === 'sound').map((s) => G.soundCode(s, s === item ? p : params(s), { standalone: false })).join('\n');
      return [['js', 'Этот звук', G.soundCode(item, p), 'js'], ['all', 'Весь набор', all, 'js']];
    }
    return Object.entries(item.files(p)).map(([path, c]) => [path, path.split('/').pop() + (path.startsWith('~') ? ' (~)' : ''), c, fileLang(path), path]);
  };

  const renderTab = () => {
    const item = sheet.item, p = sheet.p, body = $('#tab-body', sheetEl);
    sheetEl.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.tab === sheet.tab));
    if (sheet.tab === 'about') {
      const related = G.items.filter((i) => i !== item && i.type === item.type && i.group === item.group).slice(0, 3);
      const more = related.length < 2 ? G.items.filter((i) => i !== item && i.type === item.type && !related.includes(i)).slice(0, 3 - related.length) : [];
      const steps = item.install ? item.install(p) : null;
      body.innerHTML = `<div class="about">
        <p class="lead">${esc(item.desc)}</p>
        <h3>Как работает</h3><p>${esc(item.about.how)}</p>
        ${item.about.use ? `<h3>Где пригодится</h3><ul>${item.about.use.map((u) => `<li>${esc(u)}</li>`).join('')}</ul>` : ''}
        ${steps ? `<h3>Установка</h3><ol>${steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}
        ${item.about.notes ? `<h3>Важно</h3><ul>${item.about.notes.map((u) => `<li>${esc(u)}</li>`).join('')}</ul>` : ''}
        <h3>Технологии</h3><div class="card-tech">${[...item.tech, ...(item.event && !item.builder ? ['событие ' + item.event] : [])].map((t) => `<span class="tag mono">${esc(t)}</span>`).join('')}</div>
        <h3>Похожее</h3><div class="related">${[...related, ...more].map((r) => `<button type="button" data-goto="${r.id}"><span>${esc(r.title)}</span><small>${esc(r.group)}</small></button>`).join('')}</div>
      </div>`;
    } else if (sheet.tab === 'code') {
      const views = codeViews(item, p);
      if (!views.find((v) => v[0] === sheet.codeTab)) sheet.codeTab = views[0][0];
      const cur = views.find((v) => v[0] === sheet.codeTab);
      const note = item.type === 'component' ? 'Код собран из того же исходника, что и превью, с вашими настройками. Архив включает все форматы.'
        : item.type === 'sound' ? 'Функцию можно вызвать из любого обработчика: playX({ volume, pitch }). В архиве лежат JS и WAV для игровых движков и приложений.'
        : 'Путь показан относительно корня проекта (или ~ для домашней папки).';
      body.innerHTML = `<div class="code-bar"><div class="seg" role="group" aria-label="Формат">${views.map((v) => `<button type="button" data-code="${esc(v[0])}" aria-pressed="${v[0] === sheet.codeTab}" title="${esc(v[4] || v[1])}">${esc(v[1])}</button>`).join('')}</div>
        <div class="actions"><button class="btn" type="button" id="code-copy">${I('copy')}Копировать</button><button class="btn primary" type="button" id="code-dl" ${G.canSave() ? '' : 'disabled title="Скачивание недоступно в этом окне"'}>${I('down')}.zip</button></div></div>
        <pre class="code"><code>${G.highlight(cur[2], cur[3])}</code></pre><p class="code-note">${esc(note)}</p>`;
      body.dataset.raw = '';
      sheet.codeRaw = cur[2];
    } else {
      const comp = item.type === 'component', snd = item.type === 'sound';
      const opts = comp
        ? `<div class="seg" role="group" aria-label="Стек">${[['vanilla', 'HTML/JS'], ['react', 'React'], ['vue', 'Vue'], ['svelte', 'Svelte']].map(([k, l]) => `<button type="button" data-stack="${k}" aria-pressed="${sheet.promptOpt.stack === k}">${l}</button>`).join('')}</div>`
        : '';
      const codeToggle = comp || snd ? `<button class="toggle-row" type="button" id="pr-code" aria-pressed="${sheet.promptOpt.code}" style="width:auto">Приложить код<span class="switch-mini"></span></button>` : '';
      const text = promptFor(item, p, sheet.promptOpt);
      sheet.promptRaw = text;
      body.innerHTML = `<div class="prompt-opts">${opts}${codeToggle}<button class="btn primary" type="button" id="pr-copy" style="margin-left:auto">${I('copy')}Копировать промпт</button></div>
        <pre class="prompt-text">${esc(text)}</pre>`;
    }
  };

  $('#tab-body', sheetEl).addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.goto) return openSheet(G.byId[t.dataset.goto], sheet.tab);
    if (t.dataset.code) { sheet.codeTab = t.dataset.code; return renderTab(); }
    if (t.id === 'code-copy') return copy(sheet.codeRaw, 'Код скопирован');
    if (t.id === 'code-dl') return downloadItem(sheet.item);
    if (t.dataset.stack) { sheet.promptOpt.stack = t.dataset.stack; return renderTab(); }
    if (t.id === 'pr-code') { sheet.promptOpt.code = !sheet.promptOpt.code; return renderTab(); }
    if (t.id === 'pr-copy') return copy(sheet.promptRaw, 'Промпт скопирован');
  });
  sheetEl.querySelector('.tabs').addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab]');
    if (t) { sheet.tab = t.dataset.tab; renderTab(); }
  });
  sheetEl.querySelector('.tabs').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.stopPropagation();
    const tabs = ['about', 'code', 'prompt'], i = tabs.indexOf(sheet.tab);
    sheet.tab = tabs[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; renderTab();
    sheetEl.querySelector(`[data-tab="${sheet.tab}"]`).focus();
  });

  $('#st-replay', sheetEl).addEventListener('click', () => { mountStage(); if (sheet.preview.play) sheet.preview.play(); });
  $('#st-bg', sheetEl).addEventListener('click', (e) => {
    const b = e.target.closest('[data-bg]');
    if (!b) return;
    b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    const v = b.dataset.bg;
    const val = v === 'grid' ? 'linear-gradient(#ffffff0d 1px, transparent 1px) 0 0 / 22px 22px, linear-gradient(90deg, #ffffff0d 1px, transparent 1px) 0 0 / 22px 22px, #0c1016' : v;
    stageHost.style.setProperty('--glint-stage', val || '');
    stageFrame.style.background = val || '';
    if (!v) { stageHost.style.removeProperty('--glint-stage'); stageFrame.style.removeProperty('background'); }
  });
  $('#st-w', sheetEl).addEventListener('click', (e) => {
    const b = e.target.closest('[data-w]');
    if (!b) return;
    b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    stageFrame.dataset.w = b.dataset.w;
  });
  $('#st-full', sheetEl).addEventListener('click', async () => {
    try { if (document.fullscreenElement) await document.exitFullscreen(); else await stageFrame.requestFullscreen(); }
    catch { toast('Полноэкранный режим недоступен в этом окне', true); }
  });

  const setHash = (id) => {
    try {
      if (id) { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); }
      else if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    } catch {}
  };

  const openSheet = (item, tab = 'about') => {
    if (item.type === 'article') return openReader(item);
    if (sheetEl.hidden) sheet.lastFocus = document.activeElement;
    closeReader(true);
    sheet.item = item; sheet.p = params(item); sheet.tab = tab; sheet.codeTab = null;
    $('#sheet-crumb', sheetEl).textContent = `glint / ${G.types[item.type].label.toLowerCase()} / ${item.group}`;
    $('#sheet-h', sheetEl).textContent = item.title;
    sheetFavBtn().setAttribute('aria-pressed', S.fav.has(item.id));
    $('#st-replay', sheetEl).innerHTML = item.type === 'sound' ? I('play') + 'Слушать' : I('replay') + 'Перезапуск';
    const isComp = item.type === 'component';
    $('#st-replay', sheetEl).hidden = !(isComp || item.type === 'sound');
    sheetEl.querySelector('.stage-bar').hidden = !(isComp || item.type === 'sound');
    $('#st-bg', sheetEl).hidden = !isComp; $('#st-w', sheetEl).hidden = !isComp; $('#st-full', sheetEl).hidden = !isComp;
    sheetEl.hidden = false;
    document.body.style.overflow = 'hidden';
    mountStage(); renderParams(); renderTab();
    sheetEl.querySelector('.sheet-left').scrollTop = 0;
    $('#tab-body', sheetEl).scrollTop = 0;
    setHash(item.id);
    requestAnimationFrame(() => sheetEl.querySelector(`[data-tab="${sheet.tab}"]`).focus({ preventScroll: true }));
  };
  const closeSheet = () => {
    if (sheetEl.hidden) return;
    if (sheet.preview) { sheet.preview.destroy(); sheet.preview = null; }
    sheetEl.hidden = true; sheet.item = null;
    document.body.style.overflow = '';
    setHash(null);
    if (sheet.lastFocus && sheet.lastFocus.focus) sheet.lastFocus.focus({ preventScroll: true });
  };
  const navSheet = (dir) => {
    const pool = (currentList.length ? currentList : G.items).filter((i) => i.type !== 'article');
    if (!pool.length) return;
    let i = pool.indexOf(sheet.item);
    i = (i + dir + pool.length) % pool.length;
    openSheet(pool[i], sheet.tab);
  };
  sheetEl.addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) closeSheet();
    const n = e.target.closest('[data-nav]');
    if (n) navSheet(+n.dataset.nav);
  });
  sheetFavBtn().addEventListener('click', () => toggleFav(sheet.item.id));

  /* ---------- читалка статей ---------- */
  const readerEl = h(`
    <div class="sheet reader" hidden role="dialog" aria-modal="true" aria-labelledby="reader-h">
      <div class="sheet-backdrop" data-rclose></div>
      <div class="sheet-panel reader-panel">
        <div class="reader-progress" id="r-progress"></div>
        <header class="sheet-head">
          <div class="sheet-title"><small id="r-crumb"></small><h2 id="reader-h"></h2></div>
          <div class="sheet-tools">
            <button class="btn" type="button" id="r-copy">${I('copy')}<span class="hide-sm">Копировать</span></button>
            <button class="icon-btn btn fav" type="button" id="r-fav" aria-label="В избранное" style="width:40px;height:40px;padding:0">${I('star')}</button>
            <button class="icon-btn" type="button" data-rclose aria-label="Закрыть">${I('close')}</button>
          </div>
        </header>
        <div class="reader-grid"><nav class="toc" id="r-toc" aria-label="Содержание"></nav><div class="article" id="r-article"></div></div>
      </div>
    </div>`);
  document.body.appendChild(readerEl);
  let readerItem = null, readerFocus = null;
  const art = $('#r-article', readerEl);
  const openReader = (item) => {
    if (readerEl.hidden) readerFocus = document.activeElement;
    closeSheet();
    readerItem = item;
    $('#r-crumb', readerEl).textContent = `glint / статьи / ${item.group}`;
    $('#reader-h', readerEl).textContent = item.title;
    $('#r-fav', readerEl).setAttribute('aria-pressed', S.fav.has(item.id));
    art.innerHTML = `<div class="article-inner"><div class="kicker">${esc(item.group)} · ${readMinutes(item.body)} мин чтения</div><h1>${esc(item.title)}</h1>${item.body}</div>`;
    const hs = [...art.querySelectorAll('h2')];
    hs.forEach((x, i) => { x.id = 'r-h-' + i; });
    $('#r-toc', readerEl).innerHTML = '<b>Содержание</b>' + hs.map((x, i) => `<button type="button" data-h="${i}">${esc(x.textContent)}</button>`).join('');
    readerEl.hidden = false; document.body.style.overflow = 'hidden';
    art.scrollTop = 0; onRead();
    setHash(item.id);
    requestAnimationFrame(() => $('[data-rclose].icon-btn', readerEl).focus({ preventScroll: true }));
  };
  const closeReader = (silent) => {
    if (readerEl.hidden) return;
    readerEl.hidden = true; readerItem = null; document.body.style.overflow = '';
    if (!silent) { setHash(null); if (readerFocus && readerFocus.focus) readerFocus.focus({ preventScroll: true }); }
  };
  const onRead = () => {
    const max = art.scrollHeight - art.clientHeight;
    $('#r-progress', readerEl).style.transform = `scaleX(${max > 0 ? art.scrollTop / max : 1})`;
    const hs = [...art.querySelectorAll('h2')];
    let cur = -1;
    hs.forEach((x, i) => { if (x.offsetTop - art.scrollTop < 120) cur = i; });
    readerEl.querySelectorAll('#r-toc button').forEach((b, i) => b.classList.toggle('on', i === cur));
  };
  art.addEventListener('scroll', onRead, { passive: true });
  readerEl.addEventListener('click', (e) => {
    if (e.target.closest('[data-rclose]')) return closeReader();
    const t = e.target.closest('[data-h]');
    if (t) return $('#r-h-' + t.dataset.h, readerEl).scrollIntoView({ behavior: G.reducedMotion() ? 'auto' : 'smooth', block: 'start' });
    const a = e.target.closest('a[data-open]');
    if (a) { e.preventDefault(); const it = G.byId[a.dataset.open]; if (it) openSheet(it); }
    if (e.target.closest('#r-copy')) copy(readerItem.title + '\n\n' + art.innerText.split('\n').slice(2).join('\n'), 'Текст статьи скопирован');
    if (e.target.closest('#r-fav')) { toggleFav(readerItem.id); $('#r-fav', readerEl).setAttribute('aria-pressed', S.fav.has(readerItem.id)); }
  });

  /* ---------- клавиатура и маршрутизация ---------- */
  const trapFocus = (root, e) => {
    const f = [...root.querySelectorAll('button:not([disabled]):not([hidden]), input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter((x) => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === 'Escape') {
      if (!readerEl.hidden) return closeReader();
      if (!sheetEl.hidden) return closeSheet();
      if (document.activeElement === qInput && qInput.value) { qInput.value = ''; S.q = ''; applyFilters(); }
    }
    if (e.key === 'Tab') { if (!sheetEl.hidden) trapFocus(sheetEl, e); else if (!readerEl.hidden) trapFocus(readerEl, e); }
    if (typing) return;
    if ((e.key === '/' || (e.key.toLowerCase() === 'k' && (e.metaKey || e.ctrlKey))) && sheetEl.hidden && readerEl.hidden) { e.preventDefault(); qInput.focus(); qInput.select(); }
    if (!sheetEl.hidden && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.closest('.tabs, .seg, .stage-host')) navSheet(e.key === 'ArrowRight' ? 1 : -1);
  });
  const route = () => {
    const id = decodeURIComponent(location.hash.slice(1));
    const item = G.byId[id];
    if (item) { if (sheet.item !== item && readerItem !== item) openSheet(item); }
    else { closeSheet(); closeReader(true); }
  };
  window.addEventListener('hashchange', route);
  $('.brand').addEventListener('click', (e) => { e.preventDefault(); closeSheet(); setView('all'); window.scrollTo({ top: 0 }); });

  setView('all');
  if (location.hash.length > 1) route();
})();

</script>

</body></html>
